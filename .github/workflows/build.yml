name: Build Abdullah Masar V6 (Windows .exe & Android .apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Bundle Offline Amiri Calligraphy Font (.ttf)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets/fonts
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -OutFile "src/assets/fonts/Amiri-Regular.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf" -OutFile "src/assets/fonts/Amiri-Bold.ttf"
      - name: Install Tauri CLI
        run: npm install
      - name: Generate Tauri App Icons from SVG
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Build Windows Installer (.exe)
        run: npm run build
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abdullah-masar-v6-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Configure Pre-Installed Android SDK & NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* | sort -V | tail -n 1)
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Using ANDROID_HOME=$SDK_DIR and NDK_HOME=$NDK_DIR"
      - name: Bundle Offline Amiri Calligraphy Font (.ttf)
        run: |
          mkdir -p src/assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -o src/assets/fonts/Amiri-Regular.ttf
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf" -o src/assets/fonts/Amiri-Bold.ttf
      - name: Install Tauri CLI
        run: npm install
      - name: Generate Icons & Init Android Project
        run: |
          npx tauri icon src-tauri/icons/icon.svg
          npx tauri android init --ci
      - name: Build Android APK (aarch64)
        run: npx tauri android build --apk --target aarch64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: abdullah-masar-v6-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
