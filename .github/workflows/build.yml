name: Build Abdullah Masar V6 (Windows .exe & Android .apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Bundle Offline Amiri Calligraphy Font (.ttf)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/assets/fonts
          Invoke-WebRequest -Uri "https://github.com/aliftype/amiri/raw/main/Amiri-Regular.ttf" -OutFile "src/assets/fonts/Amiri-Regular.ttf"
          Invoke-WebRequest -Uri "https://github.com/aliftype/amiri/raw/main/Amiri-Bold.ttf" -OutFile "src/assets/fonts/Amiri-Bold.ttf"
      - name: Install Tauri CLI
        run: npm install
      - name: Generate Tauri App Icons from SVG
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Build Windows Installer (.exe / .msi)
        run: npm run build
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abdullah-masar-v6-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: android-actions/setup-android@v3
      - name: Bundle Offline Amiri Calligraphy Font (.ttf)
        run: |
          mkdir -p src/assets/fonts
          curl -fsSL "https://github.com/aliftype/amiri/raw/main/Amiri-Regular.ttf" -o src/assets/fonts/Amiri-Regular.ttf
          curl -fsSL "https://github.com/aliftype/amiri/raw/main/Amiri-Bold.ttf" -o src/assets/fonts/Amiri-Bold.ttf
      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
      - name: Install Tauri CLI
        run: npm install
      - name: Generate Icons & Init Android Project
        run: |
          npx tauri icon src-tauri/icons/icon.svg
          npx tauri android init --ci
      - name: Build Android APK (aarch64)
        run: npx tauri android build --apk --target aarch64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: abdullah-masar-v6-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
