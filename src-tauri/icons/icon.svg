<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#172542" />
      <stop offset="100%" stop-color="#0b1120" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Full-bleed maskable background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Subtle outer tactical rings -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="154" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="14 14" stroke-opacity="0.55" />

  <!-- Cardinal tick marks -->
  <line x1="256" y1="62" x2="256" y2="90" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="450" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
  <line x1="62" y1="256" x2="90" y2="256" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />
  <line x1="422" y1="256" x2="450" y2="256" stroke="#10b981" stroke-width="10" stroke-linecap="round" />

  <!-- Compass Needle: North (Gold) & South (Emerald) -->
  <polygon points="256,106 306,256 256,232 206,256" fill="url(#goldGrad)" />
  <polygon points="256,406 206,256 256,280 306,256" fill="url(#emeraldGrad)" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="24" fill="#0b1120" stroke="#fbbf24" stroke-width="8" />
  <circle cx="256" cy="256" r="8" fill="#34d399" />
</svg>
